<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保護ハブアシスタント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF5ED;
  --bg-soft: #FAF9F1;
  --ink: #16284F;
  --ink-soft: #5C6A88;
  --terra: #F65262;
  --terra-deep: #E23E4E;
  --terra-soft: #FCE3E6;
  --cream: #FCFBF5;
  --line: #E6E2D4;
  --jp-sans: 'Zen Maru Gothic', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--jp-sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}

/* チャット本体 (元はフローティング → 単体ページ用に中央配置) */
.ai-chat-widget {
  width: 440px;
  max-width: 100%;
  height: min(86vh, 760px);
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 28px 80px rgba(43, 24, 16, 0.18), 0 4px 16px rgba(43, 24, 16, 0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: aiChatSlideIn 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
}
@keyframes aiChatSlideIn {
  from { transform: translateY(40px) scale(0.95); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.ai-chat-header {
  background: linear-gradient(135deg, var(--terra) 0%, var(--terra-deep) 100%);
  color: var(--cream);
  padding: 18px 20px;
  display: flex; align-items: center; gap: 13px;
  flex-shrink: 0;
}
.ai-chat-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--cream);
  display: grid; place-items: center;
  color: var(--terra-deep);
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.ai-chat-avatar svg { width: 27px; height: 27px; }
.ai-chat-title-area { flex: 1; }
.ai-chat-title { font-weight: 800; font-size: 17px; letter-spacing: 0.02em; }
.ai-chat-restart {
  background: rgba(255, 255, 255, 0.2);
  border: none;
  height: 32px; padding: 0 12px;
  border-radius: 100px;
  color: var(--cream);
  cursor: pointer;
  font-family: var(--jp-sans); font-weight: 700; font-size: 12px;
  transition: background 0.15s;
}
.ai-chat-restart:hover { background: rgba(255, 255, 255, 0.35); }
.ai-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px 8px;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--bg-soft);
}
.ai-msg {
  max-width: 82%;
  font-size: 14.5px;
  line-height: 1.65;
  border-radius: 18px;
  padding: 12px 16px;
  word-break: break-word;
  white-space: pre-line;
  animation: aiMsgIn 0.25s ease;
  box-shadow: 0 1px 3px rgba(43, 24, 16, 0.06);
}
/* 送信前の回答まとめ: 項目ごとに「変更」ボタン */
.ai-msg.ai-summary { max-width: 92%; white-space: normal; }
.ai-summary-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ai-summary-row + .ai-summary-row { margin-top: 6px; }
.ai-summary-edit {
  flex-shrink: 0;
  font-family: var(--jp-sans); font-size: 11.5px; font-weight: 800;
  background: none; color: var(--terra-deep);
  border: 1.5px solid var(--terra); border-radius: 100px;
  padding: 2px 10px; margin-top: 2px;
  cursor: pointer;
}
.ai-summary-edit:hover { background: var(--terra-soft); }
@keyframes aiMsgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.ai-msg.bot {
  background: var(--cream);
  color: var(--ink);
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  border: 1px solid var(--line);
}
.ai-msg.user {
  background: var(--terra);
  color: var(--cream);
  border-bottom-right-radius: 4px;
  align-self: flex-end;
}
.ai-typing {
  align-self: flex-start;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex; gap: 4px;
}
.ai-typing span {
  width: 6px; height: 6px;
  background: var(--ink-soft);
  border-radius: 50%;
  animation: aiTypingBounce 1.2s ease-in-out infinite;
}
.ai-typing span:nth-child(2) { animation-delay: 0.2s; }
.ai-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes aiTypingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}
.ai-chat-input-area {
  background: var(--cream);
  border-top: 1px solid var(--line);
  padding: 16px 18px 18px;
  flex-shrink: 0;
  max-height: 200px;
  overflow-y: auto;
}
.ai-chat-input-area:empty { padding: 0; border-top: none; }
.ai-chat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-chat-chip {
  font-family: var(--jp-sans);
  font-size: 13.5px; font-weight: 600;
  background: var(--bg-soft);
  color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: 100px;
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.15s;
}
.ai-chat-chip:active { transform: scale(0.97); }
.ai-chat-chip:hover {
  border-color: var(--terra);
  background: var(--terra-soft);
  color: var(--terra-deep);
}
.ai-chat-chip.selected {
  border-color: var(--terra);
  background: var(--terra-soft);
  color: var(--terra-deep);
  font-weight: 800;
}
.ai-chat-multi-done { margin-top: 12px; }
.ai-chat-chip-primary {
  background: var(--terra) !important;
  border-color: var(--terra) !important;
  color: var(--cream) !important;
  font-weight: 800;
}
.ai-chat-chip-primary:hover {
  background: var(--terra-deep) !important;
  border-color: var(--terra-deep) !important;
}
.ai-chat-text-row { display: flex; gap: 8px; align-items: stretch; }
.ai-chat-text-input {
  flex: 1; min-width: 0;
  font-family: var(--jp-sans);
  font-size: 16px;
  color: var(--ink);
  padding: 10px 14px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--cream);
  outline: none;
}
.ai-chat-text-input:focus { border-color: var(--terra); }
.ai-chat-suffix { align-self: center; font-weight: 700; color: var(--ink-soft); }
.ai-chat-send-btn {
  background: var(--terra);
  color: var(--cream);
  border: none;
  border-radius: 14px;
  padding: 0 18px;
  cursor: pointer;
  font-family: var(--jp-sans); font-weight: 700; font-size: 13px;
  transition: background 0.15s;
}
.ai-chat-send-btn:hover { background: var(--terra-deep); }
/* 同居家族: 人数ぶんの行をまとめて表示 */
.ai-chat-input-area:has(.ai-members) { max-height: 360px; }
.ai-members { display: flex; flex-direction: column; gap: 10px; }
.ai-member-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ai-member-who { flex: 0 0 64px; font-size: 13px; font-weight: 700; color: var(--ink); }
.ai-member-row select, .ai-member-row input {
  flex: 1 1 120px; min-width: 0;
  font-family: var(--jp-sans); font-size: 16px; color: var(--ink);
  padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--cream); outline: none;
}
.ai-member-row select:focus, .ai-member-row input:focus { border-color: var(--terra); }
.ai-member-row input.ai-member-other { flex-basis: 100%; margin-left: 72px; }
.ai-member-age { flex: 0 0 96px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink); }
.ai-member-row .ai-member-age input { flex: 1 1 auto; width: 100%; }
.ai-member-fixed { flex: 1 1 120px; padding: 8px 10px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.ai-members .ai-chat-send-btn { align-self: flex-end; padding: 11px 26px; }
@media (max-width: 540px) {
  .ai-member-who { flex-basis: 100%; }
  .ai-member-row input.ai-member-other { margin-left: 0; }
}
/* プライバシーポリシー (チャット内の文書カード) */
.ai-privacy {
  align-self: stretch;
  flex-shrink: 0;
  max-height: 300px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  font-size: 12px;
  line-height: 1.85;
  color: var(--ink-soft);
  animation: aiMsgIn 0.25s ease;
}
.ai-privacy-title { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
.ai-privacy h4 { font-size: 12.5px; font-weight: 800; color: var(--ink); margin: 14px 0 4px; }
.ai-privacy p { margin: 0 0 8px; }
.ai-privacy ol { margin: 0 0 8px; padding-left: 20px; }
.ai-privacy li { margin-bottom: 3px; }
.ai-privacy-contact { white-space: pre-line; }
.ai-consent-check {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700; color: var(--ink);
  cursor: pointer;
  margin-bottom: 12px;
}
.ai-consent-check input { width: 20px; height: 20px; accent-color: var(--terra); cursor: pointer; flex-shrink: 0; }
.ai-consent-btn {
  width: 100%;
  font-family: var(--jp-sans); font-weight: 800; font-size: 14px;
  background: var(--terra); color: var(--cream);
  border: none; border-radius: 100px;
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.ai-consent-btn:hover:not(:disabled) { background: var(--terra-deep); }
.ai-consent-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ai-chat-back {
  display: block;
  margin: 12px auto 0;
  background: none; border: none;
  font-family: var(--jp-sans); font-size: 12.5px; font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 4px 8px;
}
.ai-chat-back:hover { color: var(--terra-deep); text-decoration: underline; }
@media (max-width: 540px) {
  body { padding: 12px; }
  .ai-chat-widget { width: 100%; height: calc(100vh - 24px); height: calc(100dvh - 24px); }
  .ai-chat-title { font-size: 12px; } /* スマホ: 「保護ハブアシスタント」が2行にならないように */
}
</style>
</head>
<body>

<div class="ai-chat-widget" id="aiChatWidget">
  <div class="ai-chat-header">
    <div class="ai-chat-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5c0 4.5-4 8-9 8-1 0-2-.1-2.9-.4L4 21l1.5-3.5C3.6 16.1 3 13.9 3 11.5 3 7 7 3.5 12 3.5s9 3.5 9 8z"/>
      </svg>
    </div>
    <div class="ai-chat-title-area">
      <div class="ai-chat-title">保護ハブアシスタント</div>
    </div>
    <button class="ai-chat-restart" onclick="startAiChat()">最初から</button>
  </div>
  <div class="ai-chat-messages" id="aiChatMessages"></div>
  <div class="ai-chat-input-area" id="aiChatInputArea"></div>
</div>

<script>
// 回答の送信先 (22heup@gmail.com のスプレッドシートに紐づく Apps Script のウェブアプリURL)
// 例: 'https://script.google.com/macros/s/XXXXXXXX/exec'
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwh7PXgpYghr_KGo__8H7pTL563MiLeLDtZtrvBIq7N4WJXqVaIzAqfSqBPxYLTESxP/exec';

const PREFECTURES = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

const ABSENCE_OPTIONS = ['なし（いつも誰かいる）','4時間未満','4〜8時間','8時間以上'];
const notEmpty = (v) => v.trim().length > 0;

const Q = {
  // 最初の質問 (元サイトでは検索前の画面で聞いていた項目)
  petType: { key: 'petType', bot: 'まず、どちらを検討中ですか？', type: 'chips', options: ['犬','猫','どちらも'] },
  prefecture: { key: 'prefecture', bot: 'どちらにお住まいですか？', type: 'select', placeholder: '都道府県を選択', options: PREFECTURES },
  age: { key: 'age', bot: 'おいくつですか？', type: 'text', numeric: true, placeholder: '例：32', suffix: '歳',
    validate: (v) => /^\d{1,3}$/.test(v) && v >= 1 && v <= 100, error: '年齢は1〜100の数字で入力してください（例：32）。' },
  familySize: { key: 'familySize', bot: 'あなたを含めて、ペットと一緒に暮らすのは何人ですか？', type: 'chips', options: ['1人（一人暮らし）','2人','3人','4人','5人','6人以上'] },
  members: { key: 'members', bot: '一緒に暮らす方について教えてください。\nご関係を選び、年齢を入力してください。', type: 'members' },
  // Tier 1: 基本マッチング質問
  housing: { key: 'housing', bot: '住まいの種類は？', type: 'chips', options: ['戸建て（持ち家）','戸建て（賃貸）','分譲マンション','賃貸マンション・アパート','社宅・寮','その他'] },
  permission: { key: 'permission', bot: 'ペットを飼ってよい住まいですか？', type: 'chips', options: ['規約・契約で許可されている','大家さん・管理会社に相談中','許可されていない','分からない'],
    replies: { '許可されていない': 'ペット可のお住まいでないと、譲渡が難しい場合があります。\nこのまま回答を続けていただいて大丈夫です。' } },
  allergy: { key: 'allergy', bot: 'あなたや一緒に暮らす方に、ペットアレルギーはありますか？', type: 'chips', options: ['なし','軽度のアレルギーあり','重度のアレルギーあり','未検査・分からない'] },
  // Tier 2: 精度マッチング用の追加質問
  // 今飼っている子は先住ペットの質問で聞いているので、ここでは過去の経験だけを聞く
  experience: { key: 'experience', type: 'multi', none: '飼ったことはない',
    get bot() { return 'これまでに飼ったことのある動物を、すべて選んでください。' + (answers.hasPet === 'はい、飼っています' ? '\n（今飼っている子は含みません）' : ''); },
    options: ['犬','猫','うさぎ・小動物','鳥','その他'] },
  hasPet: { key: 'hasPet', bot: '現在、ペットを飼っていますか？', type: 'chips', options: ['はい、飼っています','いいえ、飼っていません'] },
  petCount: { key: 'petCount', bot: '今飼っているペットは何匹ですか？', type: 'chips', options: ['1匹','2匹','3匹','4匹','5匹以上'] },
  absenceWeekday: { key: 'absenceWeekday', bot: '平日、家に誰もいない時間は1日どのくらいですか？\n（迎えた子がお留守番する時間です）', type: 'chips', options: ABSENCE_OPTIONS },
  absenceWeekend: { key: 'absenceWeekend', bot: '週末・休日、家に誰もいない時間は1日どのくらいですか？', type: 'chips', options: ABSENCE_OPTIONS },
  space: { key: 'space', bot: '迎える子が過ごすスペースを、すべて選んでください。', type: 'multi', options: ['室内フリー','ケージ・サークル併用','室内専用部屋','屋外'] },
  moving: { key: 'moving', bot: '今後数年以内に、引越しや転勤のご予定はありますか？', type: 'chips', options: ['予定なし','1年以内に予定あり','数年以内に可能性あり','分からない'] },
  // 最後の質問: 認知経路
  source: { key: 'source', bot: '保護ハブをどこで知りましたか？', type: 'chips', options: ['Instagram','Threads','ポッドキャスト','note','検索','友人の紹介','譲渡会','その他'] },
  sourceOther: { key: 'sourceOther', bot: 'どこで知ったか、よろしければ教えてください。', type: 'text', placeholder: '例：友人の紹介、譲渡会 など', validate: notEmpty },
  // 最後: 担当者から連絡するための連絡先
  name: { key: 'name', bot: '最後に、ご連絡先を教えてください。\nまず、お名前を入力してください。', type: 'text', placeholder: '例：山田 花子', autocomplete: 'name', validate: notEmpty },
  email: { key: 'email', bot: 'メールアドレスを入力してください。\n（担当者からのご連絡に使います）', type: 'text', inputType: 'email', autocomplete: 'email', placeholder: '例：hanako@example.com',
    validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), error: 'メールアドレスの形式が正しくないようです。もう一度ご確認ください。' }
};

// 同居家族: 人数を聞いたあと、ご自身 (年齢は回答済みなので表示だけ) ＋一緒に暮らす方を1画面にまとめて聞く (6人以上は6人目まで)
// 年齢は数字で入力してもらう。シートの「同居家族N：年代」の列には「35歳」のように入る (列名は既存の列に合わせて据え置き)
const MAX_MEMBERS = 5;
const MEMBER_RELATIONS = ['配偶者','パートナー（恋人）','子供','親','祖父母','兄弟姉妹','友人・ルームメイト','その他'];
const MEMBER_AGES = ['0〜5歳（未就学）','6〜12歳（小学生）','13〜17歳','18〜29歳','30代','40代','50代','60代','70歳以上'];
function memberCount() { return Math.min((parseInt(answers.familySize, 10) || 1) - 1, MAX_MEMBERS); }
function ageBandOf(age) {
  const a = parseInt(age, 10);
  if (isNaN(a)) return '';
  if (a < 6) return MEMBER_AGES[0];
  if (a < 13) return MEMBER_AGES[1];
  if (a < 18) return MEMBER_AGES[2];
  if (a < 30) return MEMBER_AGES[3];
  if (a >= 70) return MEMBER_AGES[8];
  return MEMBER_AGES[Math.floor(a / 10) + 1];
}
// 以前の「小さなお子様の有無」の列は、家族の年齢から自動で埋める
function childrenFromMembers() {
  const ages = [];
  for (let n = 1; n <= memberCount(); n++) ages.push(ageBandOf(answers[`member${n}Age`]));
  if (ages.includes(MEMBER_AGES[0])) return '未就学児がいる';
  if (ages.includes(MEMBER_AGES[1])) return '小学生がいる';
  if (ages.includes(MEMBER_AGES[2])) return '中学生以上の子がいる';
  return 'いない';
}
// 以前の「家族構成」の列は、同居家族の関係から自動で埋める (例: 配偶者・パートナー、子供)
function householdFromMembers() {
  if (memberCount() === 0) return '一人暮らし';
  const rels = [];
  for (let n = 1; n <= memberCount(); n++) {
    const r = answers[`member${n}RelOther`] || answers[`member${n}Rel`];
    if (r && !rels.includes(r)) rels.push(r);
  }
  return rels.join('、');
}

// 先住ペットは頭数ぶん同じ質問をくり返す (5匹以上は5匹目まで詳しく聞く)
const MAX_PETS = 5;
function petQuestions(n, total) {
  const who = total > 1 ? `${n}匹目の子` : '今飼っている子';
  const k = (name) => `pet${n}${name}`;
  const kind = answers[k('Kind')];
  const list = [{ key: k('Kind'), bot: `${who}について教えてください。\n種類は何ですか？`, type: 'chips', options: ['犬','猫','その他'] }];
  if (kind === 'その他') {
    list.push({ key: k('Other'), bot: 'どんな動物ですか？', type: 'text', placeholder: '例：うさぎ、ハムスター、フェレットなど', validate: notEmpty });
  } else if (kind === '犬' || kind === '猫') {
    const word = kind === '犬' ? '犬種' : '猫種';
    list.push({ key: k('Breed'), bot: word + 'を教えてください。\n（雑種・MIX・分からない場合もそのままご記入ください）', type: 'text', placeholder: kind === '犬' ? '例：チワワ / 雑種' : '例：アメショ / 雑種', validate: notEmpty });
  }
  // 性別・年齢・避妊去勢は1画面でまとめて聞く
  list.push({ key: k('Detail'), bot: '性別・年齢・避妊去勢について教えてください。', type: 'petDetail', pet: n });
  return list;
}

// ここまでの回答から質問の並びを組み立てる (分岐があるので毎回作り直す。戻ったときも同じ並びになる)
function buildQuestions() {
  const list = [Q.petType, Q.prefecture, Q.age, Q.familySize];
  if (answers.familySize && memberCount() > 0) list.push(Q.members);
  list.push(Q.housing);
  // 戸建ての持ち家は飼育許可を聞かない (シートには「持ち家」と入れる)
  if (answers.housing !== '戸建て（持ち家）') list.push(Q.permission);
  list.push(Q.allergy, Q.hasPet);
  // 現在飼っている → 頭数 → 頭数ぶん詳細
  if (answers.hasPet === 'はい、飼っています') {
    list.push(Q.petCount);
    const total = Math.min(parseInt(answers.petCount, 10) || 0, MAX_PETS);
    for (let n = 1; n <= total; n++) list.push(...petQuestions(n, total));
  }
  // 飼育経験は今のペットのあとに聞く (今飼っている子の種類は最初から選んでおく)
  if (answers.hasPet) list.push(Q.experience);
  list.push(Q.absenceWeekday, Q.absenceWeekend, Q.space, Q.moving, Q.source);
  if (answers.source === 'その他') list.push(Q.sourceOther);
  list.push(Q.name, Q.email);
  return list;
}

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

function startAiChat() {
  timers.forEach(clearTimeout);
  timers = [];
  aiChatStep = 0;
  answers = {};
  editKeys = null;
  document.getElementById('aiChatMessages').innerHTML = '';
  document.getElementById('aiChatInputArea').innerHTML = '';
  if (privacyAgreed) return startQuestions();

  later(aiChatShowPrivacy, 500);
}

// 質問ごとの「質問の吹き出し」要素。戻るときはここから下を消して聞き直す
let questionNodes = [];
// まとめから「変更」したとき: 聞き直す質問のキー。変更中は答え済みの質問を飛ばし、変更する項目と新しく必要になった質問だけ聞く
let editKeys = null;
let editChanged = false;

function aiChatAskCurrent() {
  if (editKeys) {
    const list = buildQuestions();
    while (aiChatStep < list.length && list[aiChatStep].key in answers && !editKeys.includes(list[aiChatStep].key)) aiChatStep++;
  }
  if (aiChatStep >= buildQuestions().length) {
    const edited = !!editKeys;
    editKeys = null;
    return aiChatFinish(edited);
  }
  const typing = aiChatShowTyping();
  later(() => {
    typing.remove();
    aiChatShowQuestion();
  }, 600);
}

function aiChatShowQuestion() {
  const q = buildQuestions()[aiChatStep];
  aiChatPushBot(q.bot);
  questionNodes[aiChatStep] = document.getElementById('aiChatMessages').lastElementChild;
  aiChatRenderInput(q);
  requestAnimationFrame(scrollToBottom);
}

// ひとつ前の質問に戻る (その質問以降のやり取りを消して聞き直す)
function aiChatBack() {
  if (aiChatStep <= 0) return;
  timers.forEach(clearTimeout);
  timers = [];
  aiChatStep--;
  const node = questionNodes[aiChatStep];
  while (node && node.nextSibling) node.nextSibling.remove();
  if (node) node.remove();
  buildQuestions().slice(aiChatStep).forEach(q => {
    delete answers[q.key];
    if (q.type === 'members') Object.keys(answers).filter(k => /^(member\d|selfAgeBand)/.test(k)).forEach(k => delete answers[k]);
    if (q.type === 'petDetail') ['Sex', 'Age', 'Neuter'].forEach(f => delete answers[`pet${q.pet}${f}`]);
  });
  aiChatShowQuestion();
}

function aiChatBackButton() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ai-chat-back';
  b.textContent = '← 前の質問に戻る';
  b.onclick = aiChatBack;
  return b;
}

function aiChatSetInput(...els) {
  const area = document.getElementById('aiChatInputArea');
  area.innerHTML = '';
  els.forEach(el => area.appendChild(el));
  if (editKeys) {
    if (!editChanged) area.appendChild(aiChatCancelEditButton());
  } else if (aiChatStep > 0 && aiChatStep < buildQuestions().length) {
    area.appendChild(aiChatBackButton());
  }
}

// まとめの「変更」: その項目の質問だけ聞き直し、終わったらまとめに戻る
function aiChatEdit(label, keys) {
  timers.forEach(clearTimeout);
  timers = [];
  document.querySelectorAll('.ai-summary-edit').forEach(b => b.remove());
  editKeys = keys;
  editChanged = false;
  aiChatStep = buildQuestions().findIndex(q => keys.includes(q.key));
  document.getElementById('aiChatInputArea').innerHTML = '';
  aiChatPushUser(`「${label}」を変更します`);
  later(aiChatAskCurrent, 400);
}

function aiChatCancelEditButton() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ai-chat-back';
  b.textContent = '← 変更せずにまとめに戻る';
  b.onclick = () => {
    timers.forEach(clearTimeout);
    timers = [];
    editKeys = null;
    document.getElementById('aiChatInputArea').innerHTML = '';
    aiChatFinish(true);
  };
  return b;
}

// 回答を変えたら、その答えに合わせて聞いていた質問の回答を消して聞き直す
function clearDependents(q) {
  if (q.key === 'familySize') delete answers.members; // 入力済みの方は残したまま、人数に合わせて聞き直す
  const m = q.key.match(/^pet(\d)Kind$/);
  if (m) ['Other', 'Breed'].forEach(f => delete answers[`pet${m[1]}${f}`]);
}

// 変更で使わなくなった回答を消す (例: 持ち家に変えたら飼育許可、ペットを飼っていないに変えたら先住ペット)
function pruneAnswers() {
  const keys = buildQuestions().map(q => q.key);
  Object.keys(answers).forEach(k => {
    const member = k.match(/^member(\d)/);
    const pet = k.match(/^pet(\d)(Sex|Age|Neuter)$/);
    const used = keys.includes(k)
      || (member && keys.includes('members') && member[1] <= memberCount())
      || (pet && keys.includes(`pet${pet[1]}Detail`));
    if (!used) delete answers[k];
  });
}

function aiChatRenderInput(q) {
  if (q.type === 'chips') return aiChatRenderChips(q);
  if (q.type === 'multi') return aiChatRenderMulti(q);
  if (q.type === 'members') return aiChatRenderMembers();
  if (q.type === 'petDetail') return aiChatRenderPetDetail(q.pet);
  const row = document.createElement('form');
  row.className = 'ai-chat-text-row';
  let field;
  if (q.type === 'select') {
    field = document.createElement('select');
    field.innerHTML = `<option value="">${q.placeholder}</option>` + q.options.map(o => `<option>${o}</option>`).join('');
  } else {
    field = document.createElement('input');
    if (q.numeric) { field.inputMode = 'numeric'; field.maxLength = 3; }
    if (q.inputType) field.type = q.inputType;
    if (q.autocomplete) field.autocomplete = q.autocomplete;
    field.placeholder = q.placeholder;
  }
  field.className = 'ai-chat-text-input';
  field.value = answers[q.key] || '';
  row.appendChild(field);
  if (q.suffix) {
    const s = document.createElement('span');
    s.className = 'ai-chat-suffix';
    s.textContent = q.suffix;
    row.appendChild(s);
  }
  const btn = document.createElement('button');
  btn.className = 'ai-chat-send-btn';
  btn.textContent = '送信';
  row.appendChild(btn);
  row.onsubmit = (e) => {
    e.preventDefault();
    const v = field.value.trim();
    if (!v) return;
    if (q.validate && !q.validate(v)) { aiChatPushBot(q.error); return; }
    aiChatHandleAnswer(v, q.suffix ? v + q.suffix : v);
  };
  aiChatSetInput(row);
  setTimeout(() => field.focus(), 50);
}

function aiChatRenderMembers() {
  const form = document.createElement('form');
  form.className = 'ai-members';
  const sel = (ph, opts, val) => {
    const el = document.createElement('select');
    el.innerHTML = `<option value="">${ph}</option>` + opts.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('');
    return el;
  };
  const row = (who, ...els) => {
    const r = document.createElement('div');
    r.className = 'ai-member-row';
    const w = document.createElement('span');
    w.className = 'ai-member-who';
    w.textContent = who;
    r.append(w, ...els);
    form.appendChild(r);
  };
  const fixed = (text) => {
    const s = document.createElement('span');
    s.className = 'ai-member-fixed';
    s.textContent = text;
    return s;
  };
  row('1人目', fixed('ご自身'), fixed(`${answers.age}歳`));
  const rows = [];
  for (let n = 1; n <= memberCount(); n++) {
    const rel = sel('ご関係', MEMBER_RELATIONS, answers[`member${n}Rel`]);
    const ageWrap = document.createElement('label');
    ageWrap.className = 'ai-member-age';
    const age = document.createElement('input');
    age.inputMode = 'numeric';
    age.maxLength = 3;
    age.placeholder = '年齢';
    age.value = parseInt(answers[`member${n}Age`], 10) >= 0 ? parseInt(answers[`member${n}Age`], 10) : '';
    ageWrap.append(age, '歳');
    const other = document.createElement('input');
    other.className = 'ai-member-other';
    other.placeholder = 'ご関係を入力（例：いとこ）';
    other.value = answers[`member${n}RelOther`] || '';
    other.style.display = rel.value === 'その他' ? '' : 'none';
    rel.onchange = () => { other.style.display = rel.value === 'その他' ? '' : 'none'; };
    row(`${n + 1}人目`, rel, ageWrap, other);
    rows.push({ rel, age, other });
  }
  const btn = document.createElement('button');
  btn.className = 'ai-chat-send-btn';
  btn.textContent = '送信';
  form.appendChild(btn);
  form.onsubmit = (e) => {
    e.preventDefault();
    const validAge = (v) => /^\d{1,3}$/.test(v) && v <= 120;
    const missing = rows.some(r => !r.rel.value || !r.age.value.trim() || (r.rel.value === 'その他' && !r.other.value.trim()));
    if (missing) { aiChatPushBot('すべての方のご関係と年齢を入力してください。'); return; }
    if (rows.some(r => !validAge(r.age.value.trim()))) { aiChatPushBot('年齢は数字で入力してください（例：35）。\n1歳未満のお子様は「0」と入力してください。'); return; }
    const parts = [`ご自身（${answers.age}歳）`];
    rows.forEach((r, i) => {
      const n = i + 1;
      const relText = r.rel.value === 'その他' ? r.other.value.trim() : r.rel.value;
      const ageText = `${parseInt(r.age.value, 10)}歳`;
      answers[`member${n}Rel`] = r.rel.value;
      answers[`member${n}Age`] = ageText;
      if (r.rel.value === 'その他') answers[`member${n}RelOther`] = relText;
      else delete answers[`member${n}RelOther`];
      parts.push(`${relText}（${ageText}）`);
    });
    aiChatHandleAnswer(parts.join('／'));
  };
  aiChatSetInput(form);
}

// 先住ペットの性別・年齢・避妊去勢 (年齢は「3歳」「6ヶ月」など自由に書いてもらう)
function aiChatRenderPetDetail(n) {
  const form = document.createElement('form');
  form.className = 'ai-members';
  const sel = (ph, opts, val) => {
    const el = document.createElement('select');
    el.innerHTML = `<option value="">${ph}</option>` + opts.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('');
    return el;
  };
  const row = (who, el) => {
    const r = document.createElement('div');
    r.className = 'ai-member-row';
    const w = document.createElement('span');
    w.className = 'ai-member-who';
    w.textContent = who;
    r.append(w, el);
    form.appendChild(r);
  };
  const sex = sel('選択してください', ['オス','メス','分からない'], answers[`pet${n}Sex`]);
  const age = document.createElement('input');
  age.placeholder = '例：3歳、6ヶ月';
  age.value = answers[`pet${n}Age`] || '';
  const neuter = sel('選択してください', ['済','未','分からない'], answers[`pet${n}Neuter`]);
  row('性別', sex);
  row('年齢', age);
  row('避妊・去勢', neuter);
  const btn = document.createElement('button');
  btn.className = 'ai-chat-send-btn';
  btn.textContent = '送信';
  form.appendChild(btn);
  form.onsubmit = (e) => {
    e.preventDefault();
    const ageText = age.value.trim();
    if (!sex.value || !ageText || !neuter.value) { aiChatPushBot('性別・年齢・避妊去勢をすべて入力してください。'); return; }
    answers[`pet${n}Sex`] = sex.value;
    answers[`pet${n}Age`] = ageText;
    answers[`pet${n}Neuter`] = neuter.value;
    aiChatHandleAnswer(`${sex.value}／${ageText}／避妊去勢：${neuter.value}`);
  };
  aiChatSetInput(form);
}

function aiChatRenderChips(q) {
  const row = document.createElement('div');
  row.className = 'ai-chat-chips';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'ai-chat-chip' + (answers[q.key] === o ? ' selected' : '');
    b.textContent = o;
    b.onclick = () => aiChatHandleAnswer(o);
    row.appendChild(b);
  });
  aiChatSetInput(row);
}

// 複数選択: 押すたびに選択/解除し「決定」で回答する。q.none (例:「飼ったことはない」) は他と同時に選べない
function aiChatRenderMulti(q) {
  const options = q.none ? [...q.options, q.none] : q.options;
  const picked = new Set((answers[q.key] || '').split('、').filter(o => options.includes(o)));
  const wrap = document.createElement('div');
  const row = document.createElement('div');
  row.className = 'ai-chat-chips';
  const buttons = options.map(o => {
    const b = document.createElement('button');
    b.className = 'ai-chat-chip';
    b.textContent = o;
    b.onclick = () => {
      if (picked.has(o)) picked.delete(o);
      else if (o === q.none) { picked.clear(); picked.add(o); }
      else { picked.delete(q.none); picked.add(o); }
      buttons.forEach(x => x.classList.toggle('selected', picked.has(x.textContent)));
    };
    row.appendChild(b);
    return b;
  });
  buttons.forEach(x => x.classList.toggle('selected', picked.has(x.textContent)));
  const done = document.createElement('button');
  done.className = 'ai-consent-btn ai-chat-multi-done';
  done.textContent = '決定';
  done.onclick = () => {
    if (!picked.size) { aiChatPushBot('ひとつ以上選んでください。'); return; }
    aiChatHandleAnswer(options.filter(o => picked.has(o)).join('、'));
  };
  wrap.append(row, done);
  aiChatSetInput(wrap);
}

function aiChatHandleAnswer(value, label) {
  const q = buildQuestions()[aiChatStep];
  const old = answers[q.key];
  answers[q.key] = value;
  if (editKeys) {
    editChanged = true;
    if (old !== value) clearDependents(q);
  }
  aiChatPushUser(label || value);
  document.getElementById('aiChatInputArea').innerHTML = '';
  aiChatStep++;
  const reply = q.replies && q.replies[value];
  if (reply) later(() => aiChatPushBot(reply), 400);
  later(aiChatAskCurrent, reply ? 1200 : 400);
}

// 送信前に見せる回答のまとめ: [項目名, 回答, 「変更」で聞き直す質問のキー] (同居家族・先住ペットは1行にまとめる)
function answerSummary() {
  const a = answers;
  const family = [`ご自身（${a.age}歳）`];
  for (let n = 1; n <= memberCount(); n++) family.push(`${a[`member${n}RelOther`] || a[`member${n}Rel`]}（${a[`member${n}Age`]}）`);
  const lines = [
    ['検討中', a.petType, ['petType']],
    ['お住まい', a.prefecture, ['prefecture']],
    ['年齢', a.age && a.age + '歳', ['age']],
    ['暮らす人数', a.familySize, ['familySize']],
    ['同居家族', a.members && family.join('／'), ['members']],
    ['住まい', a.housing, ['housing']],
    ['飼育許可', a.permission, ['permission']],
    ['アレルギー', a.allergy, ['allergy']],
    ['今のペット', a.hasPet === 'はい、飼っています' ? a.petCount : 'いない', ['hasPet', 'petCount']],
  ];
  for (let n = 1; n <= MAX_PETS; n++) {
    if (!a[`pet${n}Kind`]) continue;
    const kind = a[`pet${n}Other`] || a[`pet${n}Kind`];
    const breed = a[`pet${n}Breed`] ? `（${a[`pet${n}Breed`]}）` : '';
    lines.push([`${n}匹目`, `${kind}${breed}・${a[`pet${n}Sex`]}・${a[`pet${n}Age`]}・避妊去勢${a[`pet${n}Neuter`]}`,
      ['Kind', 'Other', 'Breed', 'Detail'].map(f => `pet${n}${f}`)]);
  }
  lines.push(
    ['飼育経験', a.experience, ['experience']],
    ['留守番（平日）', a.absenceWeekday, ['absenceWeekday']],
    ['留守番（週末・休日）', a.absenceWeekend, ['absenceWeekend']],
    ['過ごすスペース', a.space, ['space']],
    ['引越し・転勤', a.moving, ['moving']],
    ['知ったきっかけ', a.sourceOther ? `その他（${a.sourceOther}）` : a.source, ['source', 'sourceOther']],
    ['お名前', a.name, ['name']],
    ['メール', a.email, ['email']],
  );
  return lines.filter(([, v]) => v);
}

function aiChatShowSummary() {
  const box = document.createElement('div');
  box.className = 'ai-msg bot ai-summary';
  answerSummary().forEach(([label, value, keys]) => {
    const row = document.createElement('div');
    row.className = 'ai-summary-row';
    const text = document.createElement('span');
    text.textContent = `■${label}：${value}`;
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'ai-summary-edit';
    edit.textContent = '変更';
    edit.onclick = () => aiChatEdit(label, keys);
    row.append(text, edit);
    box.appendChild(row);
  });
  document.getElementById('aiChatMessages').appendChild(box);
}

// 全問回答後 (または変更のあと): 回答のまとめと「フォームを送信」ボタンを出す
function aiChatFinish(edited) {
  pruneAnswers();
  aiChatStep = buildQuestions().length;
  const typing = aiChatShowTyping();
  later(() => {
    typing.remove();
    aiChatPushBot(edited ? 'ご回答内容をご確認ください。' : '質問は以上です！ご回答内容をご確認ください。');
    aiChatShowSummary();
    aiChatPushBot('間違いがなければ「フォームを送信」を押してください。\n直したい項目があれば「変更」を押してください。');
    const btn = document.createElement('button');
    btn.className = 'ai-consent-btn';
    btn.textContent = 'フォームを送信';
    btn.onclick = () => aiChatSubmit(btn);
    aiChatSetInput(btn);
    scrollToBottom();
  }, 800);
}

async function aiChatSubmit(btn) {
  if (!SHEET_URL) {
    aiChatPushBot('送信先が設定されていません。（SHEET_URL を設定してください）');
    return;
  }
  btn.disabled = true;
  btn.textContent = '送信中…';
  const values = { ...answers, privacyAgreed: privacyAgreed ? '同意' : '', hasChildren: childrenFromMembers(),
    household: householdFromMembers(), selfAgeBand: ageBandOf(answers.age) };
  if (memberCount() === 0) values.familySize = '1人';
  if (answers.housing === '戸建て（持ち家）') values.permission = '持ち家';
  const fields = SHEET_FIELDS.map(([key, label]) => {
    const q = buildQuestions().find(x => x.key === key);
    const v = values[key] || '';
    return [label, v && q && q.suffix ? v + q.suffix : v];
  });
  const payload = { ...values, fields };
  try {
    // text/plain で送ればプリフライトなしで応答を読める。Apps Script は成功時に 'ok' を返す
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if ((await res.text()).trim() !== 'ok') throw new Error('送信先でエラー');
    document.getElementById('aiChatInputArea').innerHTML = '';
    document.querySelectorAll('.ai-summary-edit').forEach(b => b.remove());
    aiChatPushBot('送信が完了しました！ありがとうございます。\nご入力いただいたメールアドレスへ、担当者より改めてご連絡いたします。');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'フォームを送信';
    aiChatPushBot('送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。');
  }
  scrollToBottom();
}

startAiChat();
</script>
